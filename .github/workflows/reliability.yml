name: Reliability regression tests
on:
  pull_request:
  push:
    branches: [main, 'fix/vpn-reliability-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python and Bash syntax
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m py_compile aggsub.py vpnctl.py provision.py
          bash -n install.sh
      - name: Regression tests (no host mutations)
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/python3 -m unittest discover -s tests -v -b 2>&1 | tee test-results.txt
      - name: Real Xray v26.6.1 key parser smoke test (no VPN installation)
        shell: bash
        run: |
          curl -fLSs --connect-timeout 10 --max-time 120 --retry 2 \
            https://github.com/XTLS/Xray-core/releases/download/v26.6.1/Xray-linux-64.zip \
            -o "$RUNNER_TEMP/xray.zip"
          echo "136e822e99e616692550723e8b607cd8858c62a390aea5704938bc27930904ba  $RUNNER_TEMP/xray.zip" | sha256sum --check
          /usr/bin/python3 - <<'PYXRAY'
          import os, zipfile
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(directory / 'xray.zip') as archive:
              binary = directory / 'xray-smoke'
              binary.write_bytes(archive.read('xray'))
              binary.chmod(0o700)
          PYXRAY
          /usr/bin/python3 tests/smoke_xray.py "$RUNNER_TEMP/xray-smoke"
      - name: Install linters only
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nftables
      - name: ShellCheck
        run: shellcheck --severity=error install.sh
      - name: Validate firewall in isolated network namespace
        run: |
          /usr/bin/python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_reliability import fixture
          from vpnctl import firewall_text
          Path('/tmp/server-init-test.nft').write_text(firewall_text(fixture()['settings'], 'ens3', [22, 2222]))
          PY
          sudo unshare --net nft -c -f /tmp/server-init-test.nft
      - name: Snapshot reviewed source (tracked files only, no runtime secrets)
        if: always()
        run: git archive --format=tar HEAD -o review-source.tar
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reliability-evidence-${{ matrix.os }}
          retention-days: 7
          path: |
            review-source.tar
            test-results.txt
